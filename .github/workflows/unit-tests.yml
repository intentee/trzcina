name: unit tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup rust
        uses: ./.github/actions/setup-rust

      - name: install cargo-nextest
        uses: ./.github/actions/install-cargo-nextest

      - name: run tests
        run: make rust-test

