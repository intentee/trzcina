name: clippy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup rust
        uses: ./.github/actions/setup-rust

      - name: run clippy
        run: make clippy
