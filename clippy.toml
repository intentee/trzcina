allow-expect-in-tests = true
allow-unwrap-in-tests = true
avoid-breaking-exported-api = false
disallowed-methods = [
    { path = "core::option::Option::expect", reason = "handle the absent value with a matching Result instead" },
    { path = "core::option::Option::unwrap", reason = "handle the absent value with a matching Result instead" },
    { path = "core::result::Result::expect_err", reason = "match the expected error variant instead" },
    { path = "core::result::Result::unwrap", reason = "handle the error with a matching Result instead" },
    { path = "core::result::Result::unwrap_err", reason = "match the expected error variant instead" },
]
